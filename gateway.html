<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Gateway - HF-Furniture</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="pics/logo.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/image-fallback.js"></script>
</head>

<body class="gateway-page bg-light" data-protection="off">
    <main class="gateway-shell min-vh-100 d-flex align-items-center justify-content-center px-3 py-5">
        <section class="gateway-card">
            <div class="text-center mb-4">
                <img src="pics/logo.webp" alt="HF-Furniture" class="gateway-logo mb-3" onerror="ImageFallback.handle(this)">
                <p class="gateway-label mb-2">Owner Access</p>
                <h1 class="gateway-title mb-2">Protection Gateway</h1>
                <p class="gateway-copy mb-0">Enter your activation code to disable site protection on this browser for 12 hours.</p>
            </div>

            <form id="gatewayForm" class="d-grid gap-3">
                <label class="gateway-field">
                    <span class="gateway-field-label">Activation Code</span>
                    <input id="gatewayCode" type="password" class="form-control gateway-input" autocomplete="off" placeholder="Enter owner code">
                </label>

                <button type="submit" class="btn btn-dark py-3 text-uppercase">Activate Bypass</button>
                <button type="button" id="gatewayReset" class="btn btn-outline-dark py-3 text-uppercase">Turn Protection Back On</button>
                <a href="home.html" class="btn btn-link text-decoration-none text-uppercase gateway-link">Return to Site</a>
            </form>

            <div id="gatewayStatus" class="gateway-status mt-4" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/protect.js"></script>
    <script>
        const gatewayForm = document.getElementById('gatewayForm');
        const gatewayCode = document.getElementById('gatewayCode');
        const gatewayReset = document.getElementById('gatewayReset');
        const gatewayStatus = document.getElementById('gatewayStatus');

        function formatStatus() {
            const status = window.ProtectionAccess?.getStatus();

            if (!status) {
                gatewayStatus.className = 'gateway-status mt-4';
                gatewayStatus.textContent = 'Protection is currently active on this browser.';
                return;
            }

            const expiry = new Date(status.expiresAt);
            gatewayStatus.className = 'gateway-status gateway-status-active mt-4';
            gatewayStatus.textContent = `Protection is disabled until ${expiry.toLocaleString()}.`;
        }

        gatewayForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const isActivated = window.ProtectionAccess?.activate(gatewayCode.value);

            if (!isActivated) {
                gatewayStatus.className = 'gateway-status gateway-status-error mt-4';
                gatewayStatus.textContent = 'Invalid activation code.';
                gatewayCode.select();
                return;
            }

            gatewayCode.value = '';
            formatStatus();
        });

        gatewayReset.addEventListener('click', () => {
            window.ProtectionAccess?.deactivate();
            gatewayCode.value = '';
            formatStatus();
        });

        formatStatus();
    </script>
</body>

</html>
